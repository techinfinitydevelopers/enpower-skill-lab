<script>
    /* EMOJI BURST */
    function spBurst(el, emoji) {
        var rect = el.getBoundingClientRect();
        for (var i = 0; i < 8; i++) {
            (function (idx) {
                var e = document.createElement('div'); e.className = 'sp-emoji-burst'; e.textContent = emoji;
                var a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
                e.style.cssText = 'left:' + (rect.left + rect.width / 2) + 'px;top:' + (rect.top + rect.height / 2) + 'px;--ex:' + (Math.cos(a) * d) + 'px;--ey:' + (Math.sin(a) * d - 40) + 'px;animation-delay:' + (idx * 0.06) + 's';
                document.body.appendChild(e); setTimeout(function () { e.remove(); }, 1400);
            })(i);
        }
    }

    /* CONFETTI */
    function spConfettiFire() {
        var ct = document.getElementById('spConfetti'); if (!ct) return;
        var colors = ['#5A2D82', '#7B47A3', '#F5A623', '#F060A0', '#2BBFA4', '#3B82F6', '#FFD580'];
        var shapes = ['sp-conf-circle', 'sp-conf-square', 'sp-conf-star'];
        for (var i = 0; i < 34; i++) {
            (function (idx) {
                var d = document.createElement('div'); d.className = 'sp-conf-dot ' + shapes[idx % 3];
                var sz = Math.random() * 9 + 4;
                d.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;background:' + colors[idx % colors.length] + ';left:' + (2 + Math.random() * 96) + '%;top:-14px;animation:sp-confettiFall ' + (1.6 + Math.random() * 1.4) + 's ease-out ' + (idx * 0.045) + 's forwards';
                ct.appendChild(d); setTimeout(function () { d.remove(); }, 4000);
            })(i);
        }
    }

    /* COUNT UP */
    function spCountUp(el) {
        if (!el) return;
        var target = parseFloat(el.getAttribute('data-target')) || 0;
        var dec = parseInt(el.getAttribute('data-decimals') || '0', 10);
        var suffix = el.getAttribute('data-suffix') || '';
        var step = target / 60, cur = 0;
        var t = setInterval(function () {
            cur = Math.min(cur + step, target);
            el.textContent = cur.toFixed(dec) + suffix;
            if (cur >= target) clearInterval(t);
        }, 20);
    }

    /* LEVEL BADGE — 1–10 scale, aligned with backend labels */
    function spLevelInfo(score) {
        if (score >= 8) return { cls: 'level-gem',   text: '💎 Expert' };
        if (score >= 6) return { cls: 'level-crown', text: '👑 Strong' };
        if (score >= 4) return { cls: 'level-star',  text: '⭐ Emerging' };
        if (score >= 2) return { cls: 'level-fire',  text: '🔥 Growing' };
        return { cls: 'level-fire', text: '🌱 Beginner' };
    }

    /* STARS — 5 stars, score out of 10 (fill = score/2) */
    var SP_SF = '<svg width="16" height="16" viewBox="0 0 24 24" style="display:block"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#F5A623"/></svg>';
    var SP_SE = '<svg width="16" height="16" viewBox="0 0 24 24" style="display:block"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#D5C9E6"/></svg>';
    function spRenderStars(row) {
        var el = row.querySelector('.cr-stars');
        if (!el || el.children.length > 0) return;
        var score = parseFloat(row.getAttribute('data-score')) || 0;
        var stars = score / 2; /* 10 -> 5 stars */
        var badge = row.querySelector('.comp-row-level');
        if (badge && !badge.textContent.trim()) {
            var lvl = spLevelInfo(score);
            badge.className = 'comp-row-level ' + lvl.cls;
            badge.textContent = lvl.text;
        }
        for (var i = 0; i < 5; i++) {
            (function (idx) {
                setTimeout(function () {
                    var filled = stars - idx, s;
                    if (filled >= 1) { s = document.createElement('span'); s.className = 'cr-star'; s.style.animation = 'sp-starPop 0.4s ease both'; s.innerHTML = SP_SF; }
                    else if (filled > 0) { var p = Math.round(filled * 100); s = document.createElement('span'); s.className = 'cr-star-partial'; s.style.animation = 'sp-starPop 0.4s ease both'; s.innerHTML = '<span class="star-base">' + SP_SE + '</span><span class="star-fill" style="width:' + p + '%">' + SP_SF + '</span>'; }
                    else { s = document.createElement('span'); s.className = 'cr-star'; s.style.animation = 'sp-starPop 0.4s ease both'; s.innerHTML = SP_SE; }
                    el.appendChild(s);
                }, idx * 100);
            })(i);
        }
    }

    /* BAR ANIMATION */
    function spAnimateBar(row, delay) {
        var bar = row.querySelector('.cr-bar'), pct = row.getAttribute('data-pct');
        if (!bar || bar.classList.contains('bar-filled')) return;
        setTimeout(function () { bar.style.width = Math.min(pct, 100) + '%'; bar.classList.add('bar-filled'); }, delay || 0);
    }

    /* TYPEWRITER */
    function spTypewriter() {
        var el = document.getElementById('spName'); if (!el) return;
        var text = el.textContent.trim();
        el.style.width = 'auto'; el.style.overflow = 'visible';
        var nw = el.offsetWidth;
        el.style.overflow = 'hidden'; el.style.width = '0px';
        var start = null, dur = Math.max(900, text.length * 55);
        function step(ts) {
            if (!start) start = ts;
            var prog = Math.min((ts - start) / dur, 1);
            el.style.width = Math.round(prog * nw) + 'px';
            if (prog < 1) requestAnimationFrame(step);
            else { el.style.width = nw + 'px'; el.style.animation = 'sp-blinkCaret 0.7s step-end 3'; setTimeout(function () { el.style.borderRightColor = 'transparent'; }, 2400); }
        }
        setTimeout(function () { requestAnimationFrame(step); }, 500);
    }

    /* 3D TILT */
    document.querySelectorAll('.sp2 .profile-card').forEach(function (card) {
        card.addEventListener('mousemove', function (e) {
            var r = card.getBoundingClientRect();
            var x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = 'perspective(700px) rotateY(' + (x * 10) + 'deg) rotateX(' + (-y * 10) + 'deg) translateY(-6px) scale(1.02)';
        });
        card.addEventListener('mouseleave', function () { card.style.transform = ''; });
    });

    /* REVEAL competency rows on scroll */
    (function () {
        var cc = document.getElementById('spCompCard'); if (!cc) return;
        var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.querySelectorAll('.comp-row').forEach(function (row, i) {
                        setTimeout(function () { row.classList.add('row-visible'); spAnimateBar(row, 200); }, i * 140);
                    });
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        obs.observe(cc);
    })();

    window.addEventListener('load', function () {
        spTypewriter();
        setTimeout(function () {
            spCountUp(document.getElementById('spLevel'));
            spCountUp(document.getElementById('spAtt'));
        }, 500);
    });
</script>
