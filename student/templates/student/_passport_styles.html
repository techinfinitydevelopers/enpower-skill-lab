<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
    .sp2 {
        --purple:#5A2D82; --purple-mid:#7B47A3; --purple-light:#A97FCC; --purple-pale:#EDE3F8;
        --gold:#F5A623; --gold-light:#FFD580; --gold-pale:#FFF4DC;
        --teal:#2BBFA4; --teal-light:#A8EDE4; --pink:#F060A0; --pink-light:#FFD6EC;
        --blue:#3B82F6; --blue-light:#DBEAFE; --green:#22C55E; --green-light:#DCFCE7;
        --card:#FFFFFF; --text:#2D1B4E; --text-mid:#5B4278; --text-muted:#9B8BB8; --border:#E0D4F0;
        --radius-sm:10px; --radius:18px; --radius-lg:24px; --radius-xl:32px; --radius-pill:999px;
        --shadow:0 4px 20px rgba(90,45,130,0.10); --shadow-hover:0 10px 36px rgba(90,45,130,0.18);
        --transition:0.22s cubic-bezier(0.34,1.56,0.64,1);
        font-family:'Nunito',sans-serif; color:var(--text); position:relative;
        max-width:1080px; margin:0 auto;
    }
    .sp2 *, .sp2 *::before, .sp2 *::after { box-sizing:border-box; }
    .sp2 .material-symbols-outlined { font-family:'Material Symbols Outlined' !important; }

    /* KEYFRAMES */
    @keyframes sp-fadeUp { from{opacity:0;transform:translateY(28px);} to{opacity:1;transform:translateY(0);} }
    @keyframes sp-popIn { from{opacity:0;transform:scale(0.75) translateY(16px);} to{opacity:1;transform:scale(1) translateY(0);} }
    @keyframes sp-floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
    @keyframes sp-wiggle { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
    @keyframes sp-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(90,45,130,0.35);} 50%{box-shadow:0 0 0 14px rgba(90,45,130,0);} }
    @keyframes sp-rubberBand { 0%{transform:scale(1,1);}30%{transform:scale(1.2,0.8);}45%{transform:scale(0.85,1.15);}60%{transform:scale(1.1,0.9);}75%{transform:scale(0.95,1.05);}100%{transform:scale(1,1);} }
    @keyframes sp-confettiFall { from{transform:translateY(-30px) rotate(0);opacity:1;} to{transform:translateY(105vh) rotate(780deg);opacity:0;} }
    @keyframes sp-emojiFly { 0%{opacity:1;transform:translate(0,0) scale(1);} 100%{opacity:0;transform:translate(var(--ex),var(--ey)) scale(0.2) rotate(200deg);} }
    @keyframes sp-blinkCaret { 0%,100%{border-right-color:var(--purple);} 50%{border-right-color:transparent;} }
    @keyframes sp-slideLeft { from{opacity:0;transform:translateX(-36px);} to{opacity:1;transform:translateX(0);} }
    @keyframes sp-slideRight { from{opacity:0;transform:translateX(36px);} to{opacity:1;transform:translateX(0);} }
    @keyframes sp-slideFromLeft { from{opacity:0;transform:translateX(-44px);} to{opacity:1;transform:translateX(0);} }
    @keyframes sp-shimmerBar { 0%{left:-70%;} 100%{left:130%;} }
    @keyframes sp-starPop { 0%{transform:scale(0) rotate(-40deg);} 65%{transform:scale(1.5) rotate(10deg);} 100%{transform:scale(1) rotate(0);} }
    @keyframes sp-celebratePop { 0%{transform:scale(1);}20%{transform:scale(1.2);}40%{transform:scale(0.92);}60%{transform:scale(1.08);}100%{transform:scale(1);} }
    @keyframes sp-orbitRing { 0%{transform:scale(1);opacity:0.7;} 100%{transform:scale(1.8);opacity:0;} }
    @keyframes sp-driftA { 0%,100%{transform:translate(0,0) rotate(0);}33%{transform:translate(12px,-16px) rotate(4deg);}66%{transform:translate(-8px,10px) rotate(-3deg);} }
    @keyframes sp-driftB { 0%,100%{transform:translate(0,0) rotate(0);}40%{transform:translate(-14px,10px) rotate(-4deg);}80%{transform:translate(10px,-6px) rotate(3deg);} }
    @keyframes sp-driftC { 0%,100%{transform:translate(0,0) rotate(0);}50%{transform:translate(8px,-12px) rotate(6deg);} }
    @keyframes sp-stampIn { 0%{transform:scale(2.2) rotate(-8deg);opacity:0;} 60%{transform:scale(0.9) rotate(2deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }

    /* BACKGROUND ICONS */
    .sp2 .bg-icons { position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .sp2 .bg-icon-item { position:absolute; color:var(--purple-mid); opacity:0.085; font-variation-settings:'FILL' 1; user-select:none; }
    .sp2 .bg-icon-item:nth-child(1){top:2%;left:1%;font-size:80px;animation:sp-driftA 22s ease-in-out infinite;}
    .sp2 .bg-icon-item:nth-child(2){top:5%;left:28%;font-size:64px;animation:sp-driftB 19s ease-in-out 1s infinite;}
    .sp2 .bg-icon-item:nth-child(3){top:3%;right:2%;font-size:76px;animation:sp-driftC 24s ease-in-out 2s infinite;}
    .sp2 .bg-icon-item:nth-child(4){top:18%;left:10%;font-size:68px;animation:sp-driftA 21s ease-in-out 3s infinite;}
    .sp2 .bg-icon-item:nth-child(5){top:14%;left:54%;font-size:60px;animation:sp-driftB 17s ease-in-out .5s infinite;}
    .sp2 .bg-icon-item:nth-child(6){top:20%;right:6%;font-size:78px;animation:sp-driftC 26s ease-in-out 4s infinite;}
    .sp2 .bg-icon-item:nth-child(7){top:36%;left:2%;font-size:70px;animation:sp-driftA 20s ease-in-out 5s infinite;}
    .sp2 .bg-icon-item:nth-child(8){top:34%;left:40%;font-size:62px;animation:sp-driftB 23s ease-in-out 1.5s infinite;}
    .sp2 .bg-icon-item:nth-child(9){top:32%;right:2%;font-size:72px;animation:sp-driftC 18s ease-in-out 6s infinite;}
    .sp2 .bg-icon-item:nth-child(10){top:50%;left:16%;font-size:66px;animation:sp-driftA 25s ease-in-out 2s infinite;}
    .sp2 .bg-icon-item:nth-child(11){top:48%;left:60%;font-size:80px;animation:sp-driftB 16s ease-in-out 7s infinite;}
    .sp2 .bg-icon-item:nth-child(12){top:52%;right:4%;font-size:64px;animation:sp-driftC 22s ease-in-out 3.5s infinite;}
    .sp2 .bg-icon-item.gold { color:var(--gold); opacity:0.08; }

    /* CONFETTI + EMOJI */
    .sp-confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; overflow:hidden; }
    .sp-conf-dot { position:absolute; }
    .sp-conf-square { border-radius:3px; }
    .sp-conf-circle { border-radius:50%; }
    .sp-conf-star { clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
    .sp-emoji-burst { position:fixed; pointer-events:none; font-size:20px; z-index:9000; animation:sp-emojiFly 1.1s ease-out forwards; }

    /* HEADER */
    .sp2 .student-header {
        background:radial-gradient(circle at top right, rgba(245,166,35,0.14) 0%, transparent 38%), linear-gradient(135deg,#F7F0FF 0%,#FFFFFF 60%,#FFF8EC 100%);
        border-radius:var(--radius-xl); border:2px solid var(--border); padding:28px 36px;
        display:flex; align-items:center; gap:28px; box-shadow:var(--shadow); margin-bottom:44px;
        animation:sp-popIn 0.6s ease 0.2s both; transition:box-shadow 0.3s, transform 0.3s; position:relative; overflow:visible; z-index:1;
        height:auto; min-height:0; width:auto;
    }
    .sp2 .student-header:hover { box-shadow:var(--shadow-hover); transform:translateY(-3px); }
    .sp2 .avatar {
        width:88px; height:88px; border-radius:var(--radius-lg);
        background:linear-gradient(135deg,var(--purple),var(--purple-mid));
        display:flex; align-items:center; justify-content:center; font-family:'Fredoka One',sans-serif;
        font-size:30px; color:#fff; flex-shrink:0; cursor:pointer; transition:all 0.3s; position:relative;
        box-shadow:0 6px 20px rgba(90,45,130,0.3),inset 0 1px 0 rgba(255,255,255,0.2); animation:sp-pulse 3s ease-in-out infinite; text-transform:uppercase;
    }
    .sp2 .avatar:hover { animation:sp-rubberBand 0.7s ease; transform:scale(1.06); }
    .sp2 .avatar::after { content:'✨'; position:absolute; top:-14px; right:-14px; font-size:22px; opacity:0; transition:opacity 0.3s; animation:sp-floatY 2s ease-in-out infinite; }
    .sp2 .avatar:hover::after { opacity:1; }
    .sp2 .student-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:8px; }
    .sp2 .academic-year { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--purple-light); margin:0; animation:sp-slideLeft 0.5s ease 0.4s both; align-self:flex-start; }
    .sp2 .academic-year::before { content:'📅'; font-size:13px; }
    .sp2 .student-name-wrap { margin:0; line-height:1; }
    .sp2 .student-name { font-family:'Fredoka One',sans-serif; font-size:27px; color:var(--purple); letter-spacing:0.01em; line-height:1.2; display:inline-block; overflow:hidden; white-space:nowrap; border-right:3px solid var(--purple); width:0; vertical-align:bottom; }
    .sp2 .student-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--text-muted); font-weight:700; margin:0; animation:sp-fadeUp 0.5s ease 1s both; }
    .sp2 .meta-chip { display:inline-flex; align-items:center; gap:5px; background:var(--purple-pale); color:var(--purple-mid); padding:4px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:800; transition:all 0.2s; cursor:default; }
    .sp2 .meta-chip:hover { background:var(--purple); color:#fff; transform:scale(1.06); }
    .sp2 .meta-chip .material-symbols-outlined { font-size:14px; }
    .sp2 .stats-group { display:flex; gap:14px; margin-left:auto; flex-shrink:0; animation:sp-slideRight 0.5s ease 0.5s both; }
    .sp2 .stat-card { border:2px solid var(--border); border-radius:var(--radius-lg); padding:16px 22px; text-align:center; min-width:114px; background:linear-gradient(160deg,var(--gold-pale),#fff); transition:all var(--transition); cursor:pointer; position:relative; overflow:hidden; }
    .sp2 .stat-card::before { content:''; position:absolute; top:0; left:-70%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent); }
    .sp2 .stat-card:hover::before { animation:sp-shimmerBar 0.7s ease; }
    .sp2 .stat-card:hover { border-color:var(--gold); transform:translateY(-5px) scale(1.06); box-shadow:0 10px 28px rgba(245,166,35,0.2); }
    .sp2 .stat-emoji { font-size:22px; margin-bottom:4px; }
    .sp2 .stat-label { font-size:10px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
    .sp2 .stat-value { font-family:'Fredoka One',sans-serif; font-size:34px; color:var(--purple); line-height:1; margin-bottom:2px; }
    .sp2 .stat-sub { font-size:11px; color:var(--text-muted); font-weight:700; }

    /* SECTIONS */
    .sp2 .section-block { margin-bottom:48px; position:relative; z-index:1; }
    .sp2 .section-title { display:flex; align-items:center; gap:12px; font-family:'Fredoka One',sans-serif; font-size:22px; color:var(--purple); margin-bottom:22px; letter-spacing:0.01em; }
    .sp2 .section-icon { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--purple),var(--purple-light)); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 10px rgba(90,45,130,0.22); }
    .sp2 .section-icon .material-symbols-outlined { font-size:22px; color:#fff; font-variation-settings:'FILL' 1; }
    .sp2 .section-icon:hover { animation:sp-wiggle 0.5s ease; transform:scale(1.15); }
    .sp2 .section-badge { margin-left:auto; font-size:11px; font-weight:800; background:var(--purple-pale); color:var(--purple-mid); padding:4px 14px; border-radius:var(--radius-pill); letter-spacing:0.08em; text-transform:uppercase; }

    /* PROFILE CARDS */
    .sp2 .profiles-row { display:flex; gap:16px; overflow-x:auto; justify-content:flex-start; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; padding-bottom:6px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .sp2 .profiles-row::-webkit-scrollbar { height:4px; }
    .sp2 .profiles-row::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    .sp2 .profile-card { background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--border); padding:24px; position:relative; cursor:pointer; transition:all 0.3s cubic-bezier(0.25,0.8,0.25,1); box-shadow:var(--shadow); animation:sp-popIn 0.5s ease both; flex:1 1 240px; min-width:220px; max-width:340px; scroll-snap-align:start; overflow:hidden; }
    .sp2 .profile-card::before { content:''; position:absolute; inset:0; border-radius:var(--radius-lg); background:linear-gradient(135deg,transparent 60%,var(--purple-pale) 100%); opacity:0; transition:opacity 0.3s; }
    .sp2 .profile-card:hover::before { opacity:1; }
    .sp2 .profile-card:nth-child(1){animation-delay:0.3s;} .sp2 .profile-card:nth-child(2){animation-delay:0.44s;} .sp2 .profile-card:nth-child(3){animation-delay:0.58s;}
    .sp2 .profile-card:hover { border-color:var(--purple-light); box-shadow:var(--shadow-hover); transform:translateY(-6px) scale(1.02); }
    .sp2 .profile-card.active { border-color:var(--purple); border-width:2.5px; }
    .sp2 .pc-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
    .sp2 .pc-icon-wrap { width:48px; height:48px; border-radius:14px; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
    .sp2 .profile-card:hover .pc-icon-wrap { background:var(--purple); }
    .sp2 .pc-icon-wrap .material-symbols-outlined { font-size:26px; color:var(--purple); transition:color 0.3s; font-variation-settings:'FILL' 1; }
    .sp2 .profile-card:hover .pc-icon-wrap .material-symbols-outlined { color:#fff; }
    .sp2 .pc-match-badge { font-size:13px; font-weight:900; font-family:'Fredoka One',sans-serif; background:linear-gradient(135deg,var(--purple),var(--purple-mid)); color:#fff; padding:5px 14px; border-radius:var(--radius-pill); letter-spacing:0.02em; box-shadow:0 3px 10px rgba(90,45,130,0.25); transition:all 0.3s; position:relative; z-index:1; }
    .sp2 .profile-card:hover .pc-match-badge { animation:sp-celebratePop 0.5s ease; background:linear-gradient(135deg,var(--pink),#c0396e); }
    .sp2 .pc-role { font-family:'Fredoka One',sans-serif; font-size:18px; color:var(--purple); margin-bottom:12px; line-height:1.3; }
    .sp2 .pc-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .sp2 .pc-tag { font-size:11px; font-weight:800; padding:4px 11px; border-radius:var(--radius-sm); background:var(--purple-pale); color:var(--purple-mid); border:1.5px solid transparent; transition:all 0.2s; }
    .sp2 .profile-card:hover .pc-tag { background:var(--purple); color:#fff; }
    .sp2 .stamp { position:absolute; bottom:-12px; right:-12px; width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#F77F00); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 4px 12px rgba(245,166,35,0.35); opacity:0; animation:sp-stampIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.2s both; z-index:2; }
    .sp2 .profile-card.active .stamp { opacity:1; }

    /* COMPETENCY ROWS */
    .sp2 .comp-card { background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--border); padding:28px 30px; box-shadow:var(--shadow); }
    .sp2 .comp-row { display:flex; align-items:center; gap:16px; padding:16px 6px; border-radius:14px; cursor:pointer; opacity:0; transform:translateX(-40px); transition:background 0.25s,box-shadow 0.25s,padding 0.25s,margin 0.25s; position:relative; overflow:hidden; }
    .sp2 .comp-row.row-visible { animation:sp-slideFromLeft 0.5s cubic-bezier(0.34,1.4,0.64,1) both; opacity:1; transform:none; }
    .sp2 .comp-row:hover { background:var(--purple-pale); padding:16px 16px; margin:0 -10px; box-shadow:0 3px 14px rgba(90,45,130,0.08); }
    .sp2 .comp-row + .comp-row { border-top:2px dashed var(--border); }
    .sp2 .comp-row-level { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.07em; padding:3px 10px; border-radius:var(--radius-pill); margin-top:4px; display:inline-block; white-space:nowrap; opacity:0; transform:scale(0.7) translateY(4px); transition:opacity 0.25s ease,transform 0.3s cubic-bezier(0.34,1.56,0.64,1); transition-delay:0.08s; }
    .sp2 .comp-row:hover .comp-row-level { opacity:1; transform:scale(1) translateY(0); }
    .sp2 .level-star { background:var(--gold-pale); color:var(--gold); }
    .sp2 .level-fire { background:#FFE8D6; color:#E05D00; }
    .sp2 .level-gem { background:var(--teal-light); color:#0E7A6A; }
    .sp2 .level-crown { background:var(--pink-light); color:var(--pink); }
    .sp2 .cr-icon { width:42px; height:42px; border-radius:14px; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.3s; position:relative; }
    .sp2 .comp-row:hover .cr-icon { background:var(--purple); transform:scale(1.18) rotate(-6deg); }
    .sp2 .comp-row:hover .cr-icon .material-symbols-outlined { color:#fff; }
    .sp2 .cr-icon .material-symbols-outlined { font-size:22px; color:var(--purple); transition:color 0.3s; font-variation-settings:'FILL' 1; }
    .sp2 .cr-name { font-weight:900; font-size:14px; color:var(--text); min-width:136px; max-width:250px; flex-shrink:0; transition:color 0.2s; }
    .sp2 .comp-row:hover .cr-name { color:var(--purple); }
    /* Full competency description under the name — keeps codes from being the only label */
    .sp2 .cr-desc { font-weight:500; font-size:11px; line-height:1.4; color:var(--text-muted); margin-top:3px; white-space:normal; }
    .sp2 .comp-row:hover .cr-desc { color:var(--text-muted); }
    .sp2 .cr-bar-wrap { flex:1; height:16px; background:var(--border); border-radius:var(--radius-pill); overflow:hidden; position:relative; transition:box-shadow 0.3s; }
    .sp2 .comp-row:hover .cr-bar-wrap { box-shadow:0 0 0 3px rgba(90,45,130,0.15); }
    .sp2 .cr-bar { height:100%; border-radius:var(--radius-pill); background:linear-gradient(90deg,var(--purple),var(--purple-light),var(--gold)); width:0%; transition:width 1.5s cubic-bezier(0.34,1.56,0.64,1); position:relative; overflow:hidden; }
    .sp2 .cr-bar::before { content:''; position:absolute; top:0; left:-70%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); }
    .sp2 .cr-bar.bar-filled::before { animation:sp-shimmerBar 1.1s ease 0.9s forwards; }
    .sp2 .cr-bar::after { content:''; position:absolute; top:3px; left:5px; right:5px; height:5px; background:rgba(255,255,255,0.3); border-radius:var(--radius-pill); }
    .sp2 .cr-right { flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; min-width:96px; gap:0; opacity:0; transform:translateX(14px) scale(0.85); transition:opacity 0.35s cubic-bezier(0.34,1.56,0.64,1),transform 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none; }
    .sp2 .comp-row:hover .cr-right { opacity:1; transform:translateX(0) scale(1); pointer-events:auto; }
    .sp2 .cr-score { font-family:'Fredoka One',sans-serif; font-size:16px; color:var(--purple); white-space:nowrap; }
    .sp2 .cr-stars { display:flex; flex-direction:row; flex-wrap:nowrap; gap:2px; margin-top:5px; justify-content:flex-end; align-items:center; }
    .sp2 .cr-star, .sp2 .cr-star-partial { display:inline-flex; align-items:center; flex-shrink:0; }
    .sp2 .cr-star-partial { position:relative; overflow:hidden; width:16px; height:16px; }
    .sp2 .cr-star-partial .star-fill { position:absolute; top:0; left:0; height:100%; overflow:hidden; display:flex; align-items:center; }

    /* SUMMARY / FEEDBACK / WORK-ON */
    .sp2 .summary-card { background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--border); padding:34px 36px; box-shadow:var(--shadow); animation:sp-popIn 0.6s ease 0.7s both; transition:all 0.3s; position:relative; overflow:hidden; }
    .sp2 .summary-card::before { content:''; position:absolute; bottom:-30px; left:-30px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(90,45,130,0.05) 0%,transparent 70%); pointer-events:none; }
    .sp2 .summary-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-3px); }
    .sp2 .summary-text { font-size:15px; line-height:1.9; color:var(--text-mid); font-weight:600; }
    .sp2 .summary-text p + p { margin-top:18px; }
    .sp2 .summary-divider { height:2px; background:linear-gradient(90deg,transparent,var(--purple-pale),var(--gold-light),var(--purple-pale),transparent); margin:28px 0; border-radius:2px; }
    .sp2 .summary-footer { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; }
    .sp2 .sf-label { font-size:10px; font-weight:900; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .sp2 .sf-value { font-family:'Fredoka One',sans-serif; font-size:15px; color:var(--purple); }
    .sp2 .sf-right { text-align:right; }

    /* TWO-COLUMN GRID (report detail) */
    .sp2 .sp-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    @media(max-width:820px){ .sp2 .sp-grid2 { grid-template-columns:1fr; } }

    /* WORK-ON ITEMS */
    .sp2 .workon-card { background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--border); padding:24px 26px; box-shadow:var(--shadow); height:100%; }
